name: Deploy to GitHub Pages

# Build the site and publish it to GitHub Pages whenever main changes.
# Can also be run manually from the Actions tab (Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions needed for the official GitHub Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_APS_CLIENT_ID: ${{ secrets.VITE_APS_CLIENT_ID }}
          VITE_APS_CALLBACK_URL: ${{ secrets.VITE_APS_CALLBACK_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_METADATA_FILE_ID: ${{ secrets.VITE_METADATA_FILE_ID }}
          # Optional: overrides the extractor Worker URL baked into the code.
          # Leave the secret unset and the built-in default is used.
          VITE_EXTRACTOR_API_URL: ${{ secrets.VITE_EXTRACTOR_API_URL }}
        run: npm run build

      # ⚠️ "Re-run all jobs" on a run that already built will upload a SECOND
      # artifact named github-pages, and deploy then fails for good with
      # "Multiple artifacts named github-pages were unexpectedly found …
      # Artifact count is 2." Use "Re-run FAILED jobs" (deploy only, reusing the
      # one artifact) — or better, push a new commit. Seen on run #253.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ⚠️ Do NOT try to raise `timeout` here — 600000ms (10 min) is the action's
      # hard maximum and a larger value is silently clamped back to it ("timeout
      # value is greater than the allowed maximum"). Tried on 2026-08-06; it is a
      # no-op. When GitHub's Pages queue stalls, the deployment sits in
      # `deployment_queued` until that ceiling and the action then CANCELS its own
      # deployment. The Pages deployment ID is the commit SHA, so that commit is
      # then permanently cancelled: re-running it fails in seconds with a bare
      # "Deployment cancelled." and only a NEW commit can deploy. Nothing in this
      # workflow can prevent that — wait for the queue to recover, then push a new
      # commit (or re-run from the Actions tab once main has moved on).
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
